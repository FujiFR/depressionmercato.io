<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mercato Dépression Pro v13.1 📉</title>
    
    <!-- Balises PWA Mobile -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mercato Pro">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/235/235252.png">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0f14 0%, #1a1a24 100%);
            --card-bg: rgba(30, 30, 45, 0.85);
            --card-sub: rgba(42, 42, 64, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f1f2f6;
            --text-muted: #a4b0be;
            --office-red: #ff4757;
            --office-orange: #ffa502;
            --office-yellow: #eccc68;
            --office-blue: #2e86de;
            --office-green: #2ed573;
            --office-purple: #9b59b6;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            padding-top: calc(15px + env(safe-area-inset-top));
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
        }

        header h1 {
            font-size: 1.8em;
            margin: 0 0 5px 0;
            background: linear-gradient(45deg, var(--office-red), var(--office-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9em;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 500px;
        }

        .section {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 18px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        h2 {
            font-size: 1.15em;
            margin-top: 0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        h3 { color: var(--office-blue); margin-top: 0; font-size: 1em; }
        #loadingOverlay { text-align: center; padding: 20px; }

        .market-list { list-style: none; padding: 0; margin: 0; }
        
        .market-item {
            background: var(--card-sub);
            margin-bottom: 12px;
            border-radius: 12px;
            border-left: 5px solid #444;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .market-item.top-1 { border-left-color: var(--office-red); }
        .market-item.top-2 { border-left-color: var(--office-orange); }
        .market-item.top-3 { border-left-color: var(--office-yellow); }

        .item-header { display: flex; align-items: flex-start; justify-content: space-between; }
        .name { font-weight: 700; font-size: 1.1em; color: #fff; }
        
        /* Style des statuts dynamiques mis en valeur */
        .status { 
            font-size: 0.85em; 
            color: #ffdda1; 
            margin-top: 5px; 
            font-style: italic;
            line-height: 1.3;
        }
        
        .mood-reason-tag {
            display: inline-block;
            background: rgba(46, 134, 222, 0.15);
            color: #54a0ff;
            font-size: 0.75em;
            padding: 2px 8px;
            border-radius: 6px;
            margin-top: 6px;
        }

        .colleague-actions {
            display: grid;
            grid-template-columns: auto 1fr 1fr auto;
            gap: 8px;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 8px;
        }

        .odds {
            font-size: 1em;
            font-weight: 800;
            padding: 8px 10px;
            background: linear-gradient(135deg, #ff4757 0%, #9b59b6 100%);
            border-radius: 8px;
            text-align: center;
        }

        .vote-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            font-size: 1.2em;
            cursor: pointer;
        }

        .rip-btn {
            background: rgba(255, 71, 87, 0.12);
            color: #ff4757;
            border: 1px solid rgba(255, 71, 87, 0.2);
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.8em;
        }

        .wailing-wall {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(15, 15, 20, 0.9);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .wailing-post {
            background: var(--card-sub);
            border-left: 3px solid var(--office-purple);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.85em;
        }
        .wailing-meta { font-size: 0.7em; color: var(--office-purple); margin-top: 4px; }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(255,255,255,0.01);
            padding: 12px;
            border-radius: 10px;
        }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-weight: bold; font-size: 0.75em; color: var(--text-muted); }
        input, select, textarea {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #222232;
            color: white;
            font-size: 0.9em;
        }

        button.submit-btn {
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            color: white;
            background: var(--office-blue);
        }
        button.accent-btn { background: var(--office-red); }

        .arbitrage-list { display: flex; flex-direction: column; gap: 10px; }
        .arbitrage-card {
            background: var(--card-sub);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }
        .arbitrage-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        
        .card-badge { padding: 4px 8px; border-radius: 5px; font-weight: bold; font-size: 0.75em; }
        .card-yellow { background: var(--office-yellow); color: #000; }
        .card-red { background: var(--office-red); color: #fff; }
        
        .var-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .action-sm { padding: 10px; font-size: 0.85em; border-radius: 6px; border: none; font-weight: bold; }
        .btn-success { background: var(--office-green); color: #000; }
        .btn-danger { background: var(--office-red); color: #fff; }

        .chart-container { position: relative; height: 220px; width: 100%; }

        .fame-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .tombstone {
            background: #1c1c22;
            border: 1px solid #555;
            border-radius: 10px 10px 0 0;
            padding: 12px;
            text-align: center;
        }
        .tombstone .rip-name { font-weight: bold; font-size: 1em; color: #fff; }
        .tombstone .rip-reason { font-style: italic; font-size: 0.75em; color: var(--office-red); margin-top: 4px; }
    </style>
</head>
<body>

    <header>
        <h1>📉 Mercato Dépression</h1>
        <div class="subtitle">Saison 2026 — Pocket Edition V13.1 📱</div>
    </header>

    <div class="container">
        
        <!-- CLASSEMENT -->
        <div class="section">
            <h2>🏆 Argus de l'Épuisement</h2>
            <div id="loadingOverlay">⏳ Synchronisation...</div>
            <ul id="marketList" class="market-list" style="display:none;"></ul>
        </div>

        <!-- MUR DES LAMENTATIONS -->
        <div class="section" style="border-color: var(--office-purple);">
            <h2 style="color: var(--office-purple);">🏛️ Le Mur des Lamentations</h2>
            <div class="wailing-wall" id="wailingWallBox"></div>
            <form id="wailingForm">
                <select class="colleagueSelect" id="wailerSelect" required><option value="">Qui êtes-vous ?</option></select>
                <input type="text" id="wailText" placeholder="Exprimez votre seum..." required>
                <button type="submit" class="submit-btn" style="background: var(--office-purple);">Crier 🗣️</button>
            </form>
        </div>

        <!-- COMMISSION DE DISCIPLINE -->
        <div class="section" style="border-color: var(--office-orange);">
            <h2 style="color: var(--office-orange);">🟥 🟨 Arbitrage VAR</h2>
            <form id="cardForm" style="margin-bottom: 15px;">
                <select class="colleagueSelect" id="cardTargetSelect" required><option value="">-- Sélectionner la cible --</option></select>
                <select id="cardType" required><option value="JAUNE">🟨 Carton Jaune</option><option value="ROUGE">🟥 Carton Rouge</option></select>
                <input type="text" id="cardReason" placeholder="Motif du carton..." required>
                <input type="text" id="cardPenalty" placeholder="Gage requis..." required>
                <button type="submit" class="submit-btn" style="background: var(--office-orange); color:black;">Dégainer</button>
            </form>
            
            <div class="arbitrage-list" id="cardsMobileContainer"></div>
        </div>

        <!-- CONSOLE MANAGEMENT -->
        <div class="section">
            <h2>⚙️ Console Manager</h2>
            <form id="moodForm">
                <div class="form-group">
                    <select class="colleagueSelect" id="moodColleagueSelect" required><option value="">-- Collaborateur --</option></select>
                </div>
                <div class="form-group">
                    <select id="moodSelect" required>
                        <option value="1">😀 Tout va bien (Côte Haute / Moral OK)</option>
                        <option value="2">😐 Stable</option>
                        <option value="3">😮‍💨 Soupirs (Côte baisse / Risque)</option>
                        <option value="4">😭 Crise Imprimante (Côte faible / Alerte)</option>
                        <option value="5">🔥 Alerte Recrutement (MERCATO CRITIQUE)</option>
                    </select>
                </div>
                <div class="form-group">
                    <select id="moodReasonSelect">
                        <option value="">-- Motif Pro --</option>
                        <option value="Attaque de catoche 🙀">Attaque de catoche 🙀</option>
                        <option value="Réunion inutile de 2h ⏰">Réunion inutile de 2h ⏰</option>
                        <option value="J'ai trop faim 🥖">J'ai trop faim 🥖</option>
                        <option value="Vie de merde 😩">Vie de merde 😩</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn accent-btn">Inscrire l'Incident</button>
            </form>
        </div>

        <!-- GRAPH -->
        <div class="section">
            <h2>📊 Courbe de Motivation</h2>
            <div class="chart-container">
                <canvas id="oddsChart"></canvas>
            </div>
        </div>

        <!-- CIMETIÈRE -->
        <div class="section" style="background: #111;">
            <h2>🪦 Cimetière des RTT</h2>
            <div class="fame-grid" id="fameGridBox"></div>
        </div>

    </div>

    <!-- FIREBASE SERVICES -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCn70t0lsSEoucFQDjvziA-KNO4u4jF_H4",
      authDomain: "mercatodepression.firebaseapp.com",
      projectId: "mercatodepression",
      storageBucket: "mercatodepression.firebasestorage.app",
      messagingSenderId: "409377389288",
      appId: "1:409377389288:web:55e333c9be54796d5fe75d",
      measurementId: "G-K1CF0LGN7X"
    };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let oddsChartInstance = null;
        let activeColleaguesCount = 0;

        function calculateOdds(score) {
            if (score <= 0) return 99.0;
            return parseFloat(((100 / score) + 1).toFixed(2));
        }

        function getTodayLabel() {
            const d = new Date();
            return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`;
        }

        // --- GÉNÉRATEUR DYNAMIQUE DE STATUTS ---
        function generateDynamicStatus(direction, currentOdds) {
            // Contextes basés sur la côte boursière de burn-out
            if (direction === 'up') { // 👍 Pouce haut = Le moral monte, l'indice baisse, la côte grimpe (Stable)
                if (currentOdds > 10) {
                    const positiveHigh = [
                        "A souri à un client. Suspect.",
                        "A trouvé de la force dans un double expresso. Reste calme.",
                        "Arrive à relativiser. Le management s'inquiète.",
                        "Semble immunisé contre les e-mails passifs-agressifs aujourd'hui."
                    ];
                    return positiveHigh[Math.floor(Math.random() * positiveHigh.length)];
                } else {
                    return "Remonte la pente, mais revient de très loin. Surveillance requise.";
                }
            } 
            
            if (direction === 'down') { // 👎 Pouce bas = Le moral baisse, l'indice explose, la côte s'effondre (Alerte)
                if (currentOdds <= 2.5) { // Côte très basse = Gros risque de départ
                    const criticalStatus = [
                        "⚠️ ALERTE ROUGE : Met discrètement son profil LinkedIn à jour.",
                        "🔥 Côte au plus bas. Risque de fuite vers la concurrence sous 48h.",
                        "A regardé fixement la fenêtre pendant 14 minutes. Code rouge.",
                        "N'a même plus la force de râler. Phase terminale."
                    ];
                    return criticalStatus[Math.floor(Math.random() * criticalStatus.length)];
                } else {
                    const warningStatus = [
                        "Vient de voir sa demande de RTT refusée. Ça gronde.",
                        "Assiste à un call Teams qui aurait pu être un mail.",
                        "Le seum s'accumule doucement mais sûrement.",
                        "Soupir sonore identifié au pôle Sud de l'open space."
                    ];
                    return warningStatus[Math.floor(Math.random() * warningStatus.length)];
                }
            }

            // Statuts par défaut via formulaire d'incident managérial
            if (currentOdds <= 1.5) return "🚨 Crise managériale aiguë. Prêt à tout plaquer.";
            if (currentOdds <= 3) return "⚡ En pleine négociation interne avec sa conscience pour rester.";
            if (currentOdds <= 6) return "⏳ Motivation en chute libre. Éviter de lui parler de budget.";
            return "R.A.S. Subit le quotidien corporatif de façon standard.";
        }

        db.collection("colleagues").onSnapshot((snapshot) => {
            document.getElementById('loadingOverlay').style.display = 'none';
            document.getElementById('marketList').style.display = 'block';
            let all = [];
            snapshot.forEach(doc => { all.push({ id: doc.id, ...doc.data() }); });
            let active = all.filter(c => !c.isRip).sort((a, b) => b.score - a.score);
            activeColleaguesCount = active.length;
            
            renderDashboard(active);
            renderChart(active);
            renderHallOfFame(all.filter(c => c.isRip));
        });

        function renderDashboard(list) {
            const mList = document.getElementById('marketList');
            const selects = document.querySelectorAll('.colleagueSelect');
            mList.innerHTML = list.length === 0 ? "<li style='text-align:center;color:#888;padding:10px;'>Personne en open space.</li>" : "";
            
            list.forEach((c, index) => {
                const li = document.createElement('li');
                const currentOdds = calculateOdds(c.score);
                li.className = `market-item ${index === 0 ? 'top-1' : index === 1 ? 'top-2' : index === 2 ? 'top-3' : ''}`;
                li.innerHTML = `
                    <div class="item-header">
                        <div>
                            <span class="name">#${index + 1} ${c.name}</span>
                            <div class="status">${c.status || 'En poste.'}</div>
                            ${c.lastReason ? `<span class="mood-reason-tag">${c.lastReason}</span>` : ''}
                        </div>
                    </div>
                    <div class="colleague-actions">
                        <span class="odds">${currentOdds}</span>
                        <button class="vote-btn" onclick="applyVote('${c.id}', ${c.score}, 'up')">👍</button>
                        <button class="vote-btn" onclick="applyVote('${c.id}', ${c.score}, 'down')">👎</button>
                        <button class="rip-btn" onclick="triggerRip('${c.id}')">💀</button>
                    </div>
                `;
                mList.appendChild(li);
            });

            selects.forEach(select => {
                const currentVal = select.value;
                select.innerHTML = '<option value="">-- Choisir --</option>';
                list.forEach(c => { select.innerHTML += `<option value="${c.id}[SPLIT]${c.name}">${c.name}</option>`; });
                select.value = currentVal;
            });
        }

        // --- APPLIQUER UN VOTE (Modifie le score ET injecte un statut dynamique) ---
        window.applyVote = function(id, currentScore, direction) {
            let change = (direction === 'up') ? -5 : 5;
            let newScore = Math.max(5, currentScore + change);
            let nextOdds = calculateOdds(newScore);
            
            // Génération de l'humeur contextuelle amusante
            let dynamicStatusText = generateDynamicStatus(direction, nextOdds);

            db.collection("colleagues").doc(id).update({
                score: newScore,
                status: dynamicStatusText
            }).then(() => {
                db.collection("colleagues").doc(id).get().then(doc => {
                    let h = doc.data().history || [];
                    h.push({ date: getTodayLabel(), odds: nextOdds });
                    db.collection("colleagues").doc(id).update({ history: h });
                });
            });
        };

        window.triggerRip = function(id) {
            if(confirm("Confirmer le départ RTT / placard ?")) {
                db.collection("colleagues").doc(id).update({ isRip: true, status: "A succombé aux RTT." });
            }
        };

        // COMMISSION DE LA VAR
        db.collection("cards").onSnapshot((snapshot) => {
            const container = document.getElementById('cardsMobileContainer');
            container.innerHTML = snapshot.empty ? '<div style="text-align:center;color:#666;font-size:0.9em;">Aucun litige en cours.</div>' : '';
            const threshold = Math.ceil(activeColleaguesCount / 2);

            snapshot.forEach(doc => {
                let card = doc.data();
                let cardId = doc.id;
                let actionsHtml = '';

                if (card.status === 'En cours') {
                    actionsHtml = `
                        <div class="var-actions">
                            <button class="action-sm btn-success" onclick="processVAR('${cardId}', 'valider')">Valider ✅</button>
                            <button class="action-sm btn-danger" onclick="processVAR('${cardId}', 'contester')">Contester ❌</button>
                        </div>
                    `;
                }

                container.innerHTML += `
                    <div class="arbitrage-card">
                        <div class="arbitrage-header">
                            <strong>${card.targetName}</strong>
                            <span class="card-badge ${card.type==='ROUGE'?'card-red':'card-yellow'}">${card.type}</span>
                        </div>
                        <div style="font-size:0.85em;">
                            <strong>Motif :</strong> ${card.reason}<br>
                            <strong>Gage :</strong> ${card.penalty}
                        </div>
                        <div style="font-size:0.75em; color:var(--text-muted); margin-top:8px; display:flex; justify-content:space-between;">
                            <span>Pour: ${card.votesPour||0}/${threshold} | Contre: ${card.votesContre||0}/${threshold}</span>
                            <span style="font-weight:bold;color:#ffa502">${card.status}</span>
                        </div>
                        ${actionsHtml}
                    </div>
                `;
            });
        });

        window.processVAR = function(cardId, action) {
            const ref = db.collection("cards").doc(cardId);
            const threshold = Math.ceil(activeColleaguesCount / 2);
            db.runTransaction((transaction) => {
                return transaction.get(ref).then((doc) => {
                    if (!doc.exists) return;
                    let d = doc.data(), p = d.votesPour || 0, c = d.votesContre || 0, nextStatus = d.status;
                    if (action === 'valider') { p++; if(p >= threshold) nextStatus = "Validé"; }
                    else { c++; if(c >= threshold) nextStatus = "Annulé par la VAR"; }
                    transaction.update(ref, { votesPour: p, votesContre: c, status: nextStatus });
                });
            });
        };

        // INCIDENT MANAGEMENT VIA FORMULAIRE
        document.getElementById('moodForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const raw = document.getElementById('moodColleagueSelect').value; if(!raw) return;
            const id = raw.split('[SPLIT]')[0];
            const motive = document.getElementById('moodReasonSelect').value || "Incident non répertorié";
            const intensity = parseInt(document.getElementById('moodSelect').value);
            
            let score = 45; 
            if(intensity===1) score=15; 
            if(intensity===3) score=55; 
            if(intensity===4) score=75; 
            if(intensity===5) score=95;
            
            let forcedOdds = calculateOdds(score);
            let dynamicStatusText = generateDynamicStatus('form', forcedOdds);

            db.collection("colleagues").doc(id).update({ 
                score: score, 
                lastReason: motive, 
                status: dynamicStatusText 
            });
            document.getElementById('moodForm').reset();
        });

        document.getElementById('wailingForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const raw = document.getElementById('wailerSelect').value; if(!raw) return;
            const id = raw.split('[SPLIT]')[0], name = raw.split('[SPLIT]')[1], txt = document.getElementById('wailText').value.trim();
            db.collection("complaints").add({ text: txt, authorName: name, timestamp: Date.now() });
            
            db.collection("colleagues").doc(id).get().then(doc => {
                if(doc.exists) {
                    let s = doc.data().score || 45;
                    let newScore = Math.max(5, s - 5);
                    db.collection("colleagues").doc(id).update({
                        score: newScore,
                        status: "Se sent un peu plus léger après avoir déversé son fiel."
                    });
                }
            });
            document.getElementById('wailText').value = "";
        });

        document.getElementById('cardForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const raw = document.getElementById('cardTargetSelect').value; if(!raw) return;
            db.collection("cards").add({
                targetName: raw.split('[SPLIT]')[1],
                type: document.getElementById('cardType').value,
                reason: document.getElementById('cardReason').value.trim(),
                penalty: document.getElementById('cardPenalty').value.trim(),
                votesPour: 0, votesContre: 0, status: "En cours"
            });
            document.getElementById('cardForm').reset();
        });

        db.collection("complaints").orderBy("timestamp", "desc").limit(10).onSnapshot((snapshot) => {
            const box = document.getElementById('wailingWallBox'); box.innerHTML = "";
            snapshot.forEach(doc => {
                let p = doc.data();
                box.innerHTML += `<div class="wailing-post">"${p.text}"<div class="wailing-meta">✍️ ${p.authorName}</div></div>`;
            });
        });

        function renderHallOfFame(deadList) {
            const box = document.getElementById('fameGridBox'); box.innerHTML = "";
            deadList.forEach(c => {
                box.innerHTML += `<div class="tombstone"><div class="rip-name">${c.name}</div><div class="rip-reason">${c.lastReason||'Libéré du open space.'}</div></div>`;
            });
        }

        function renderChart(list) {
            const ctx = document.getElementById('oddsChart').getContext('2d');
            const label = getTodayLabel();
            const datasets = list.map((c, idx) => ({
                label: c.name,
                data: (c.history || [{date: label, odds: calculateOdds(c.score)}]).map(h => h.odds),
                borderColor: `hsla(${(idx * 85) % 360}, 80%, 60%, 1)`,
                borderWidth: 2, tension: 0.2, backgroundColor: 'transparent'
            }));
            if (oddsChartInstance) oddsChartInstance.destroy();
            oddsChartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels: [label], datasets: datasets },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }
    </script>
</body>
</html>
